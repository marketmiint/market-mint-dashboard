<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Charts | Market Mint</title>
<meta name="description" content="Free full-screen stock charts for every NSE company: drawing tools, indicators, and every order win, result, split, bonus and dividend marked on the chart.">
<link rel="icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/nav.css">
<link rel="stylesheet" href="../assets/mm.css">
<style>
/* Charts page: full-height app under the site header. Library: KLineChart v10 (Apache-2.0, assets/klc.js). */
body.cpg{overflow-x:hidden}
.cp{display:flex;flex-direction:column;height:var(--ch,calc(100vh - 110px));min-height:520px;background:var(--card,#fff);border-bottom:1px solid var(--line)}
.ctop{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:13px}
.ctop .sym{display:flex;align-items:center;gap:10px;min-width:0;margin-right:4px}
.ctop .sym .nm{font-weight:800;font-size:15.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.ctop .sym .nm small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.ctop .sym .nm a{color:inherit;text-decoration:none}
.ctop .px{font-variant-numeric:tabular-nums;white-space:nowrap}.ctop .px b{font-size:16px}.ctop .px small{display:block;font-size:11.5px;color:var(--muted)}
.ctop .fs{position:relative}
.ctop .fs input{width:190px;padding:7px 10px 7px 30px;border:1.5px solid var(--line);border-radius:9px;font:inherit;background:var(--card);color:var(--ink)}
.ctop .fs svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted)}
.ctop .fs .sugg{min-width:320px}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.seg{display:inline-flex;background:var(--soft,#f3f5f8);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:5px 9px;border-radius:7px;font:inherit;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card,#fff);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bt{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 10px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.bt:hover{background:var(--soft)}.bt.on{border-color:var(--ink)}
.bt svg{flex:none}
select.bt{padding-right:6px}
.ctop .rt{margin-left:auto;display:flex;gap:6px;align-items:center}
.cbody{flex:1;display:flex;min-height:0;position:relative}
.ctools{width:44px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;overflow-y:auto;flex:none}
.ctools button{width:34px;height:32px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.ctools button:hover{background:var(--soft)}
.ctools button.on{background:#e8f1ea;color:#2f7a40}
.ctools hr{width:24px;border:0;border-top:1px solid var(--line);margin:4px 0}
.cwrap{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
.cwrap .kbox{flex:1;position:relative;min-height:0}
#kc{position:absolute;inset:0}
.clg{padding:5px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.5;min-height:29px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clg b{color:var(--ink);font-weight:600}.clg .up{color:var(--up,#0f8f55)}.clg .down{color:var(--down,#d0342c)}
.clg .ev{margin-left:8px}
.clg .ev>span{display:inline-flex;align-items:center;margin:0 6px 0 0;padding:2px 7px;border-radius:6px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:600;cursor:pointer}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;z-index:6;background:var(--card);text-align:center;padding:20px}
.msg[hidden]{display:none}
.hint{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:#111827;color:#fff;padding:7px 12px;border-radius:9px;font-size:12.5px;z-index:7;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.hint.on{opacity:.92}
/* side panel: events */
.cside{width:330px;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;flex:none;background:var(--card)}
.cside[hidden]{display:none}
.cside .hd{padding:10px 12px 6px;display:flex;align-items:center;gap:8px}
.cside .hd b{font-size:14px}.cside .hd .x{margin-left:auto}
.cside .chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 8px;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:3px 9px 3px 6px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.chip.off{opacity:.45}
.chip i,.dot{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-size:9.5px;font-weight:800;flex:none}
.chip small{color:var(--muted);font-weight:500}
.elist{flex:1;overflow-y:auto;font-size:13px}
.erow{display:flex;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.erow:hover{background:var(--soft)}.erow.on{background:#fff7e6}
.erow .t{flex:1;min-width:0}.erow .t b{font-weight:600}
.erow .t small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.erow .t .tx{display:block;color:var(--ink);margin-top:2px;line-height:1.35;word-wrap:break-word}
.erow .t a{color:var(--muted);font-size:11.5px}
.erow .mv{font-variant-numeric:tabular-nums;font-size:12px;text-align:right;white-space:nowrap}
.erow .mv small{display:block;color:var(--muted);font-size:10.5px}
.eyr{padding:6px 12px;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--soft);position:sticky;top:0;z-index:1}
.cnote{padding:8px 12px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line)}
/* popovers */
.pop{position:absolute;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(15,23,42,.18);padding:10px;font-size:13px}
.pop[hidden]{display:none}
.ipop{width:360px;max-height:70vh;overflow-y:auto}
.ipop h4{margin:6px 4px 6px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ipop .it{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:8px}
.ipop .it:hover{background:var(--soft)}
.ipop .it .l{flex:1;min-width:0}.ipop .it .l small{display:block;color:var(--muted);font-size:11.5px}
.ipop .it input{width:78px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:12px;background:var(--card);color:var(--ink)}
.ipop .it button{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:3px 9px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink)}
.ipop .it button.rm{color:var(--down,#d0342c)}
.ipop .it.act{background:#f2f8f3}
.ipop .q{width:100%;padding:7px 9px;border:1.5px solid var(--line);border-radius:8px;font:inherit;margin-bottom:4px;background:var(--card);color:var(--ink)}
.cp:fullscreen{height:100vh}
body.full header.mmh,body.full nav.mmb,body.full .mmsheet,body.full footer.mmf{display:none!important}
body.full{padding:0!important;margin:0}
body.full .cp{height:100vh!important;min-height:0;border-bottom:0}
.brandmini{display:none;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-weight:800;font-size:12.5px;letter-spacing:.04em;margin-right:4px}
.brandmini img{width:24px;height:24px;border-radius:6px}
body.full .brandmini{display:inline-flex}
body.full #po{display:none}
.cp{position:relative}
/* side panel tabs */
.stabs{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line)}
.stabs button[data-tab]{border:0;background:none;padding:6px 11px;border-radius:8px;font:inherit;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer}
.stabs button[data-tab].on{background:var(--soft);color:var(--ink)}
.stabs .x{margin-left:auto}
.evh{display:flex;align-items:flex-start;gap:6px;padding:8px 10px 0 0;border-bottom:1px solid var(--line)}
.evh .chips{flex:1;border-bottom:0;padding-left:12px}
.evh .bt,.wlh [data-close]{padding:5px 9px;flex:none}
#ecount{color:var(--muted);font-weight:500;font-size:12px}
.cside section{display:flex;flex-direction:column;min-height:0;flex:1}
.cside section[hidden]{display:none}
/* watchlists */
.wlh{display:flex;gap:6px;padding:8px 10px 6px;align-items:center}
.wlh select{flex:1;min-width:0;font-weight:700;padding:6px 8px}
.wlh .bt{padding:5px 9px}
.wladd{padding:0 10px 8px;position:relative;border-bottom:1px solid var(--line)}
.wladd input{width:100%;padding:7px 10px;border:1.5px solid var(--line);border-radius:9px;font:inherit;font-size:13px;background:var(--card);color:var(--ink)}
.wladd .sugg{left:10px;right:10px;min-width:0}
.wlist{flex:1;overflow-y:auto}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto 62px 18px;gap:8px;align-items:center;padding:7px 8px 7px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.wrow:hover{background:var(--soft)}.wrow.on{background:#e8f1ea;box-shadow:inset 3px 0 0 #3b8a4c}
.wrow b{font-weight:700}.wrow small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .p{text-align:right;font-variant-numeric:tabular-nums}.wrow .c{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.wrow .rm{opacity:0;border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px;padding:0;line-height:1}.wrow:hover .rm{opacity:1}
.wrow.drag{opacity:.35}.wrow.over{box-shadow:inset 0 2px 0 #2563eb}
.wempty{padding:22px 14px;color:var(--muted);font-size:13px;line-height:1.5}
.wmenu{width:230px;padding:6px}.wmenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.wmenu button:hover{background:var(--soft)}.wmenu button.on{font-weight:700}.wmenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.wmenu .lab{padding:6px 10px 2px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.wst{font-size:15px;padding:4px 8px!important;line-height:1}.wst.on{color:#d97706;border-color:#f3d19c}
/* type anywhere box (stock search / candle size) */
.kd{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:60;width:min(480px,94%);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(15,23,42,.25);overflow:hidden}
.kd[hidden]{display:none}
.kd input{width:100%;font:inherit;font-size:19px;font-weight:700;padding:13px 16px;border:0;border-bottom:1px solid var(--line);text-transform:uppercase;background:transparent;color:var(--ink);outline:0}
.kd .kl{max-height:min(360px,55vh);overflow-y:auto}
.kd .ki{display:flex;gap:12px;padding:8px 16px;cursor:pointer;align-items:center;font-size:13.5px}
.kd .ki.on{background:var(--soft)}.kd .ki b{min-width:100px}.kd .ki span{flex:1;min-width:0;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kd .ki .r{flex:none;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.kd .kh{padding:9px 16px;font-size:12.5px;color:var(--muted);background:var(--soft)}
.kd .kh b{color:var(--ink)}
.kd kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--card)}
@media (max-width:900px){.cside{position:absolute;right:0;top:0;bottom:0;z-index:20;box-shadow:-8px 0 30px rgba(0,0,0,.12);width:min(330px,88vw)}}
@media (max-width:700px){
  .cp{height:var(--ch,calc(100vh - 120px))}
  .ctop{gap:6px;padding:6px 8px}.ctop .fs input{width:130px}.ctop .sym .nm{max-width:150px}
  .ctop .rt{margin-left:0}.ctop .hide-sm{display:none}
  .seg button{padding:5px 7px}
  .cbody{flex-direction:column-reverse}
  .ctools{width:auto;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:3px 6px;overflow-x:auto;overflow-y:hidden;justify-content:flex-start}
  .ctools hr{width:1px;height:22px;border:0;border-left:1px solid var(--line);margin:0 4px}
  .ipop{width:min(360px,94vw)}
}
</style>
</head>
<body data-root="../" class="cpg">
<script>if (/[?&]full=1\b/.test(location.search)) document.body.classList.add("full");</script>
<script src="../assets/mm.js"></script>
<script src="../assets/mmchart.js"></script>
<script src="../assets/klc.js"></script>
<main class="cp" id="cp">
  <div class="ctop">
    <a class="brandmini" href="../" target="_blank" rel="noopener" title="Market Mint website"><img src="../logo.png" alt=""><span class="hide-sm">MARKET MINT</span></a>
    <label class="fs"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Change stock…" autocomplete="off" aria-label="Pick a stock to chart"></label>
    <div class="sym"><div class="nm" id="nm">–</div><div class="px" id="px"></div><button class="bt wst" id="wst" title="Add to watchlist (Alt+W)">☆</button></div>
    <span class="seg" id="tf" aria-label="Candle size"><button data-p="d" title="Daily candles">D</button><button data-p="w" title="Weekly candles">W</button><button data-p="m" title="Monthly candles">M</button></span>
    <span class="seg hide-sm" id="rg" aria-label="Range"><button data-r="3M">3M</button><button data-r="6M">6M</button><button data-r="1Y">1Y</button><button data-r="3Y">3Y</button><button data-r="5Y">5Y</button><button data-r="All">All</button></span>
    <select class="bt" id="ty" aria-label="Chart type" title="Chart type">
      <option value="candle_solid">Candles</option><option value="candle_stroke">Hollow candles</option><option value="heikin">Heikin Ashi</option>
      <option value="ohlc">Bars</option><option value="area">Line</option></select>
    <button class="bt" id="ib" title="Indicators"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l5-6 4 4 9-10"/></svg>Indicators</button>
    <button class="bt hide-sm" id="lg" title="Log scale: equal % moves look equal">Log</button>
    <div class="rt">
      <button class="bt" id="wb" title="Watchlists"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg><span class="hide-sm">Watchlist</span></button>
      <button class="bt" id="eb" title="Order wins, results, splits, bonus, dividends"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Events <small id="ecount"></small></button>
      <button class="bt hide-sm" id="sn" title="Save a picture of the chart"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <button class="bt" id="po" title="Open this chart in its own big window"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-8 8"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span class="hide-sm">Pop out</span></button>
      <button class="bt" id="fz" title="Full screen"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>
  <div class="cbody">
    <div class="ctools" id="tools" aria-label="Drawing tools"></div>
    <div class="cwrap"><div class="clg" id="clg"></div><div class="kbox"><div id="kc"></div><div class="msg" id="msg">Loading chart…</div><div class="hint" id="hint"></div></div></div>
    <aside class="cside" id="side" aria-label="Watchlists and events">
      <section id="pwl">
        <div class="wlh"><select class="bt" id="wsel" aria-label="Pick a watchlist"></select><button class="bt" id="wadd" title="Add this stock (Alt+W)">+</button><button class="bt" id="wmb" title="Watchlist menu" aria-label="Watchlist menu">⋯</button><button class="bt" data-close title="Close panel" aria-label="Close panel">×</button></div>
        <div class="wladd"><input id="wq" type="search" placeholder="Add a stock to this list…" autocomplete="off" aria-label="Add a stock to this list"></div>
        <div class="wlist" id="wlist"></div>
        <div class="cnote">Saved in this browser. ↑ ↓ keys move through the list. “My watchlist” is the same as the ★ on stock pages.</div>
      </section>
      <section id="pev" hidden>
        <div class="evh"><div class="chips" id="chips"></div><button class="bt" data-close title="Close panel" aria-label="Close panel">×</button></div>
        <div class="elist" id="elist"></div>
        <div class="cnote">From NSE filings since 2005. Tap an event to jump to it. Prices are adjusted for splits and bonuses, so old prices look lower than they were.</div>
      </section>
    </aside>
  </div>
  <div class="pop ipop" id="ipop" hidden></div>
  <div class="pop wmenu" id="wmenu" hidden></div>
  <div class="kd" id="kd" hidden><input id="kq" aria-label="Type a stock name, or a candle size like 1D, 1W, 1M" autocomplete="off" spellcheck="false"><div class="kl" id="kl"></div><div class="kh" id="kh"></div></div>
</main>
<script>
(function () {
  const K = window.klinecharts, $ = s => document.querySelector(s), esc = MM.esc;
  const DAY = 86400000;
  const css = (k, f) => (getComputedStyle(document.documentElement).getPropertyValue(k) || "").trim() || f;
  const UP = css("--up", "#0f8f55"), DN = css("--down", "#d0342c"), INK = css("--ink", "#111827"), MUT = css("--muted", "#6b7280"), LINE = css("--line", "#e8eaef"), CARD = css("--card", "#ffffff");
  const fmtD = t => new Date(t).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
  const num = (p, d) => p == null ? "–" : Number(p).toLocaleString("en-IN", { minimumFractionDigits: d ?? (Math.abs(p) < 100 ? 2 : 1), maximumFractionDigits: d ?? (Math.abs(p) < 100 ? 2 : 1) });
  const vol = v => !v ? "–" : v >= 1e7 ? (v / 1e7).toFixed(2) + " Cr" : v >= 1e5 ? (v / 1e5).toFixed(2) + " L" : Math.round(v).toLocaleString("en-IN");
  const sgn = (v, d = 1) => v == null ? "–" : (v > 0 ? "+" : "") + v.toFixed(d) + "%";

  // ---------- event kinds
  const EK = {
    o: { name: "Order wins", one: "Order win", letter: "O", color: "#1f6fd1", above: true },
    r: { name: "Results", one: "Result", letter: "R", color: "#c98a0c", above: true },
    s: { name: "Splits & bonus", one: "", letter: "S", color: "#7c3aed", above: false },
    d: { name: "Dividends", one: "Dividend", letter: "D", color: "#0e9384", above: false },
    x: { name: "Rights, buyback, demerger", one: "", letter: "•", color: "#6b7280", above: false },
  };

  // ---------- saved settings (this browser only)
  const PREF = "mmk1";
  const DEF = { tf: "d", sp: 1, tab: "wl", ty: "candle_solid", log: false, side: innerWidth > 900, ev: { o: 1, r: 1, s: 1, d: 0, x: 1 },
    ind: [{ n: "MA", p: [50, 200], main: 1 }, { n: "VOL", p: [20], main: 0 }] };
  let P = DEF;
  try { P = Object.assign({}, DEF, JSON.parse(localStorage.getItem(PREF) || "{}")); P.ev = Object.assign({}, DEF.ev, P.ev); } catch (e) {}
  const save = () => { try { localStorage.setItem(PREF, JSON.stringify(P)); } catch (e) {} };

  // ---------- page height: fill the window under the site header
  const fit = () => { const h = document.querySelector("header.mmh"), b = document.querySelector("nav.mmb");
    const top = h ? h.getBoundingClientRect().bottom + scrollY : 0, bot = b && getComputedStyle(b).display !== "none" ? b.offsetHeight : 0;
    $("#cp").style.setProperty("--ch", Math.max(520, innerHeight - top - bot) + "px"); chart && chart.resize(); };
  addEventListener("resize", fit);

  };
  document.addEventListener("click", e => { if (!e.target.closest("#wmenu")) $("#wmenu").hidden = true; });
  MM.onLive && MM.onLive(() => { if (!$("#side").hidden && P.tab === "wl") wlDraw(); });
  addEventListener("storage", e => { if (e.key === MAIN || e.key === WK) { try { const n = JSON.parse(localStorage.getItem(WK) || "null"); if (n && n.lists) { W = n; if (!W.lists.find(l => l.id === "main")) W.lists.unshift({ id: "main", name: "My watchlist" }); } } catch (er) {} wlDraw(); } });

  // ---------- type anywhere (like TradingView): letters = find a stock, a number first = candle size (1D, 2W, 3M, 1Y)
  let kItems = [], kOn = 0;
  function findStocks(q) {
    q = q.trim().toUpperCase(); if (!q || !IDX) return [];
    const words = q.split(/\s+/), out = [];
    for (const r of IDX.list) { const s = r.s, n = (r.n || "").toUpperCase(), nw = n.split(/[\s&.,()-]+/); let sc = -1;
      if (s === q) sc = 1000; else if (s.startsWith(q)) sc = 600 - s.length; else if (n.startsWith(q)) sc = 500;
      else if (words.every(w => s.includes(w) || nw.some(x => x.startsWith(w)))) sc = 200;
      if (sc >= 0) out.push([sc + Math.log10((r.m || 1) + 1) * 10, r]); }
    return out.sort((a, b) => b[0] - a[0]).slice(0, 12).map(x => x[1]);
  }
  function parseTf(v) {
    const m = /^(\d{1,3})\s*([a-z]*)$/i.exec(v.trim()); if (!m) return null;
    const n = +m[1], u = m[2].toLowerCase();
    if (!u || /^(s|sec|secs|second|seconds|min|mins|minute|minutes|h|hr|hrs|hour|hours)$/.test(u))
      return { err: "Minute and hour candles are not available: our free data is end-of-day, so the smallest candle is 1 day (1D)." };
    const p = /^d(ay|ays)?$/.test(u) ? "d" : /^w(k|ks|eek|eeks)?$/.test(u) ? "w" : /^(m|mo|mon|month|months)$/.test(u) ? "m" : /^y(r|rs|ear|ears)?$/.test(u) ? "y" : null;
    if (!p || n < 1) return null;
    if (p === "y") return n <= 5 ? { p: "m", n: 12 * n } : { err: "Up to 5Y candles." };
    if (n > { d: 60, w: 52, m: 60 }[p]) return { err: "That candle is too big. Try up to 60D, 52W or 60M." };
    return { p, n };
  }
  function kdDraw() {
    const v = $("#kq").value.trim();
    if (/^\d/.test(v)) { const t = parseTf(v); kItems = []; $("#kl").innerHTML = "";
      $("#kh").innerHTML = !t ? "Candle size: a number and <b>D</b>, <b>W</b>, <b>M</b> or <b>Y</b>. <kbd>1D</kbd> daily · <kbd>2W</kbd> two weeks · <kbd>3M</kbd> three months · <kbd>1Y</kbd> yearly"
        : t.err ? esc(t.err) : `Press <kbd>Enter</kbd> for <b>${tfName(t.p, t.n)}</b> candles`; return; }
    kItems = findStocks(v); kOn = Math.min(kOn, Math.max(0, kItems.length - 1));
    $("#kl").innerHTML = kItems.map((r, i) => { const x = pxOf(r.s); return `<div class="ki ${i === kOn ? "on" : ""}" data-i="${i}"><b>${esc(r.s)}</b><span>${esc(r.n)}${r.i ? " · " + esc(r.i) : ""}</span>
      <span class="r">${x.p != null ? num(x.p) : ""} <span class="${MM.cls(x.c)}" style="color:inherit">${x.c != null ? `<b class="${MM.cls(x.c)}" style="min-width:0;font-weight:600">${sgn(x.c, 2)}</b>` : ""}</span></span></div>`; }).join("");
    $("#kh").innerHTML = !IDX ? "Loading the stock list…" : kItems.length ? "<kbd>↑</kbd> <kbd>↓</kbd> choose · <kbd>Enter</kbd> open · <kbd>Esc</kbd> close · type <kbd>1D</kbd> <kbd>1W</kbd> <kbd>1M</kbd> for candle size"
      : v ? `No NSE company matches “${esc(v)}”.` : "Type a company name or NSE symbol";
  }
  const kdOpen = ch => { $("#kd").hidden = false; $("#kq").value = ch || ""; kOn = 0; kdDraw(); $("#kq").focus(); };
  const kdClose = () => { $("#kd").hidden = true; $("#kq").blur(); };
  $("#kq").addEventListener("input", () => { kOn = 0; kdDraw(); });
  $("#kq").addEventListener("keydown", e => {
    if (e.key === "Escape") { e.preventDefault(); kdClose(); }
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!kItems.length) return; kOn = (kOn + (e.key === "ArrowDown" ? 1 : -1) + kItems.length) % kItems.length; kdDraw();
      const on = $("#kl .ki.on"); on && on.scrollIntoView({ block: "nearest" }); }
    else if (e.key === "Enter") { e.preventDefault(); const v = $("#kq").value.trim();
      if (/^\d/.test(v)) { const t = parseTf(v); if (t && !t.err) { kdClose(); setPer(t.p, t.n); hint(tfName(t.p, t.n) + " candles"); } return; }
      const r = kItems[kOn]; if (r) { kdClose(); go(r.s); } }
  });
  $("#kl").addEventListener("click", e => { const it = e.target.closest(".ki"); if (!it) return; const r = kItems[+it.dataset.i]; kdClose(); if (r) go(r.s); });
  document.addEventListener("mousedown", e => { if (!$("#kd").hidden && !e.target.closest("#kd")) kdClose(); });
  document.addEventListener("keydown", e => {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey) return;
    if (e.target.closest && e.target.closest("input,select,textarea,[contenteditable=true]")) return;
    if (e.altKey) { if (e.code === "KeyW") { e.preventDefault(); wlToggle(SYM); } return; }
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && !$("#side").hidden && P.tab === "wl") { e.preventDefault(); wlStep(e.key === "ArrowDown" ? 1 : -1); return; }
    if (e.key.length === 1 && /[a-z0-9&]/i.test(e.key)) { e.preventDefault(); kdOpen(e.key); }
  });

  // ---------- load a stock
  function reload() { chart.resetData(); setTimeout(afterData, 0); }
  async function go(sym, push = true) {
    sym = String(sym || "").toUpperCase().trim(); if (!sym) return;
    SYM = sym; D = null; EV = null; EVL = []; EVB = {};
    if (push) history.replaceState(null, "", "?" + encodeURIComponent(sym) + (tfCode() !== "d" ? "&tf=" + tfCode() : "") + FULLQ);
    wlDraw();
    $("#msg").hidden = false; $("#msg").textContent = "Loading chart…";
    const [idx, d, ev] = await Promise.all([MM.index().catch(() => null), MMChart.load(sym).catch(() => null),
      null, MM.live ? MM.live().catch(() => null) : null]);
    if (SYM !== sym) return;
    ROW = idx && idx.list ? idx.list.find(r => r.s === sym) : null;
    NAME = ROW ? ROW.n : sym;
    document.title = `${NAME} chart | Market Mint`;
    $("#nm").innerHTML = `<a href="../s/?${encodeURIComponent(sym)}" title="Open the stock page">${esc(NAME)}</a><small>${esc(sym)} · NSE${ROW && ROW.i ? " · " + esc(ROW.i) : ""}</small>`;
    if (!d) { $("#msg").innerHTML = `No price history for <b>&nbsp;${esc(sym)}&nbsp;</b> yet. Try another stock in the search box.`; $("#px").innerHTML = ""; return; }
    D = { d: d.d.map(x => Object.assign({}, x)), w: d.w.map(x => Object.assign({}, x)) };
    liveMerge(); MM.liveShown && MM.liveShown();
    EV = d.ev || ev; buildEvents(); drawSide(); head();
    $("#msg").hidden = true;
    if (PER === "d" && !D.d.length) PER = "w";
    chart.setSymbol({ ticker: sym, pricePrecision: 2, volumePrecision: 0 });
    chart.setPeriod(period());
    setTimeout(() => { fit(); afterData(); segOn(); zoomDefault(); }, 0);
    setTimeout(fit, 400);
    MM.updated && MM.updated(new Date(D.d.length ? D.d[D.d.length - 1].t * DAY : Date.now()).toISOString().slice(0, 10));
  }

  // ---------- start
  applyInd(); setLog();
  $("#side").hidden = !P.side; showTab(); segOn();
  const qs = new URLSearchParams(location.search);
  const first = [...qs.keys()].find(k => k === k.toUpperCase() && k.length > 0) || qs.get("s") || localStorage.getItem("mmk_last") || "RELIANCE";
  { const m = /^(\d{0,2})([dwm])$/i.exec(qs.get("tf") || ""); if (m) { PER = m[2].toLowerCase(); SPAN = Math.max(1, +m[1] || 1); } }
  const _go = go; go = (s, p) => { try { localStorage.setItem("mmk_last", String(s).toUpperCase()); } catch (e) {} return _go(s, p); };
  requestAnimationFrame(() => { fit(); go(first); });
})();
</script>
</body>
