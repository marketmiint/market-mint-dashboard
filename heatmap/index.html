<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Results heatmap: share-price moves since results | Market Mint</title><meta name="description" content="Every NSE company&#x27;s share-price move since its quarterly results, by sector. Updated daily.">
<link rel="icon" href="../logo.png"><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/nav.css"><link rel="stylesheet" href="../assets/mm.css">
<style>
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.ctl{margin-top:0}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 14px;align-items:center}
.ctl select,.ctl input{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.ctl input{flex:1 1 200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:var(--card);color:var(--muted);padding:8px 11px;cursor:pointer}
.seg button.on{background:var(--soft);color:var(--ink)}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.sum span{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sum b{font-size:21px;font-variant-numeric:tabular-nums}
@media (max-width:720px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sec h2 .avg{font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));grid-auto-rows:46px;grid-auto-flow:dense;gap:3px;padding:8px}
.tile{border-radius:6px;padding:4px 5px;font-size:11px;line-height:1.15;cursor:pointer;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:center;min-width:0}
.tile b{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{font-variant-numeric:tabular-nums;opacity:.95}
.tile.L{grid-column:span 2;grid-row:span 2;font-size:13px}.tile.L b{font-size:14px}
.tile.M{grid-column:span 2}
.tile:hover{outline:2px solid var(--ink)}
.legend2{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:-4px 0 12px}
.legend2 i{display:block;width:160px;height:8px;border-radius:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.mini{display:flex;justify-content:space-between;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.mini:last-child{border-bottom:0}.mini:hover{background:var(--soft)}
.mini .r{font-weight:700;font-variant-numeric:tabular-nums}
.mini small{color:var(--muted);display:block;font-size:12px}
.tbl{overflow-x:auto}
.tbl table th{cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
.tbl table th.on{color:var(--ink)}
.tbl td:first-child,.tbl th:first-child{position:sticky;left:0;background:var(--card);z-index:1;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.tbl tr:hover td{background:var(--soft)}
.tbl td a{text-decoration:none;font-weight:600}
.tbl small{color:var(--muted);font-weight:500;margin-left:4px}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:transparent;color:var(--mint-d);font:inherit;font-weight:700;padding:12px;cursor:pointer}
dialog{border:0;padding:0;border-radius:18px;max-width:min(480px,calc(100vw - 24px));width:100%;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(5,15,11,.6)}
.mb{padding:16px}.mb h3{margin:0 0 2px;font-size:18px}
.mrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.mrow span:first-child{color:var(--muted)}.mrow span:last-child{font-weight:600;text-align:right}
.mact{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;text-align:center;text-decoration:none;font:inherit;font-weight:700;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.p{background:var(--mint);color:#06281c;border-color:var(--mint)}
.note2{font-size:12.5px;color:var(--muted);margin:-6px 0 14px}
.more[hidden]{display:none}
#iT td{white-space:nowrap}
</style></head>
<body data-root="../">
<script src="../assets/mm.js"></script>
<main class="wrap"><div class="top"><div><h1 class="pt">Earnings</h1><p class="lead" style="margin:0">How each stock has moved since its quarterly results · prices of <b id="asof">…</b></p></div><span class="seg2" aria-label="Earnings views"><a href="../earnings/" class="">Results</a><a href="../screener/" class="">Full table</a><a href="../heatmap/" class="on">Heatmap</a><a href="../earnings/?v=upcoming" class="">Upcoming</a></span></div><div style="height:14px"></div>
<div class="ctl">
  <select id="season" aria-label="Quarter"></select>
  <div class="seg" id="caps"><button data-c="All" class="on">All</button><button data-c="Large">Large</button><button data-c="Mid">Mid</button><button data-c="Small">Small</button><button data-c="Micro">Micro</button></div>
  <div class="seg" id="colour"><button data-k="move" class="on">Colour: move</button><button data-k="grade">Colour: grade</button></div>
  <input id="q" type="search" placeholder="Find a company">
</div>
<div class="legend2" id="legend"></div>
<div class="sum" id="sum"></div>
<div class="two" id="movers"></div>
<div id="secs" style="margin-top:14px"></div>
<dialog id="dlg"><div class="mb" id="dlgB"></div></dialog>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pc = (v, d=1) => v == null ? "–" : v > 999 ? ">+999%" : v < -999 ? "<−999%" : (v > 0 ? "+" : "") + v.toFixed(d) + "%";
const cls = v => v == null ? "" : v > 0 ? "up" : v < 0 ? "down" : "";
const crs = v => v == null ? "–" : v >= 100000 ? "₹" + (v/100000).toFixed(2) + " L Cr" : "₹" + Math.round(v).toLocaleString("en-IN") + " Cr";
const capOf = m => m >= 100000 ? "Large" : m >= 30000 ? "Mid" : m >= 5000 ? "Small" : "Micro";
const GR = {Excellent:["💎","#085c6e"],Great:["🚀","#0a8f5a"],Good:["✅","#5cbf8a"],OK:["🟡","#d9a521"],Weak:["🔻","#c43434"]};
const fmtDay = iso => new Date(iso + "T12:00:00+05:30").toLocaleDateString("en-IN",{day:"numeric",month:"short"});
let DATA = null, PAGES = new Set();
const page = sym => MM.stockUrl(sym);
function popup(r) {
  const row = (k, v) => v == null || v === "–" ? "" : `<div class="mrow"><span>${k}</span><span>${v}</span></div>`;
  const g = GR[r.rating];
  $("#dlgB").innerHTML = `<h3>${esc(r.name)}</h3><div style="color:var(--muted);font-size:13px;margin-bottom:8px">NSE: ${esc(r.sym)}${r.sector ? " · " + esc(r.sector) : ""} · ${capOf(r.mcap)} cap</div>
    ${row("Results day", fmtDay(r.day))}
    ${row("Grade", g ? g[0] + " " + r.rating + (r.graded_by === "card" ? "" : " <small style='color:var(--muted)'>(from Yahoo numbers)</small>") : null)}
    ${row("Stock since results", r.move != null ? `<span class="${cls(r.move)}">${pc(r.move)}</span>` : null)}
    ${row("Results-day move", r.day1 != null ? `<span class="${cls(r.day1)}">${pc(r.day1)}</span>` : null)}
    ${row("Sales", r.sales != null ? crs(r.sales) + ` <span class="${cls(r.sales_yoy)}">${r.sales_yoy != null ? pc(r.sales_yoy) + " YoY" : ""}</span>` : null)}
    ${row("Operating profit YoY", r.op_yoy != null ? `<span class="${cls(r.op_yoy)}">${pc(r.op_yoy)}</span>` : null)}
    ${row("Net profit", r.pat != null ? crs(r.pat) + ` <span class="${cls(r.pat_yoy)}">${r.pat_yoy != null ? pc(r.pat_yoy) + " YoY" : ""}</span>` : null)}
    ${row("Market cap", crs(r.mcap))}${row("Price", r.price ? "₹" + r.price.toLocaleString("en-IN") : null)}
    <div class="mact">${page(r.sym) ? `<a class="btn p" href="${page(r.sym)}">Company page</a>` : ""}<button class="btn" onclick="document.getElementById('dlg').close()">Close</button></div>`;
  $("#dlg").showModal();
}
document.addEventListener("click", e => { if (e.target === $("#dlg")) $("#dlg").close(); });
async function loadData() {
  const r = await fetch("../data/season.json?t=" + Date.now(), {cache: "no-store"});
  DATA = await r.json();
  PAGES = new Set(DATA.pages || []);
  const sel = $("#season");
  sel.innerHTML = Object.keys(DATA.seasons).map(k => `<option>${k}</option>`).join("");
}

const st = {cap: "All", colour: "move", q: ""};
function colour(r) {
  if (st.colour === "grade") return r.rating ? GR[r.rating][1] : "#7d8a84";
  const v = r.move; if (v == null) return "#7d8a84";
  const t = Math.min(1, Math.abs(v) / 15);
  const a = v >= 0 ? [10, 143, 90] : [196, 52, 52], z = [110, 122, 116];
  const m = a.map((c, i) => Math.round(z[i] + (c - z[i]) * (0.25 + 0.75 * t)));
  return `rgb(${m.join(",")})`;
}
function draw() {
  const S = DATA.seasons[$("#season").value];
  $("#asof").textContent = fmtDay(S.asof); MM.updated && MM.updated(S.asof);
  let rows = S.rows.filter(r => (st.cap === "All" || capOf(r.mcap) === st.cap) &&
    (!st.q || (r.sym + " " + r.name).toLowerCase().includes(st.q)));
  const mv = rows.filter(r => r.move != null);
  const up = mv.filter(r => r.move > 0).length;
  const avg = mv.length ? mv.reduce((a, r) => a + r.move, 0) / mv.length : null;
  const med = mv.length ? mv.map(r => r.move).sort((a, b) => a - b)[Math.floor(mv.length / 2)] : null;
  $("#sum").innerHTML = `<div><span>Reported</span><b>${rows.length}</b></div><div><span>Up since results</span><b>${mv.length ? Math.round(up / mv.length * 100) + "%" : "–"}</b></div>
    <div><span>Average move</span><b class="${cls(avg)}">${pc(avg)}</b></div><div><span>Median move</span><b class="${cls(med)}">${pc(med)}</b></div>`;
  $("#legend").innerHTML = st.colour === "move"
    ? `<span>−15%</span><i style="background:linear-gradient(90deg,rgb(196,52,52),rgb(110,122,116),rgb(10,143,90))"></i><span>+15%</span><span>· big tiles = large caps</span>`
    : Object.entries(GR).map(([k, v]) => `<span style="display:flex;gap:4px;align-items:center"><b style="width:10px;height:10px;border-radius:3px;background:${v[1]};display:inline-block"></b>${k}</span>`).join("") + `<span>· grey = not graded yet</span>`;
  const top = mv.slice().sort((a, b) => b.move - a.move);
  const list = (arr, t) => `<div class="panel"><h2>${t}</h2>${arr.map(r => `<div class="mini" data-s="${esc(r.sym)}"><div>${esc(r.name)}<small>${fmtDay(r.day)}${r.rating ? " · " + GR[r.rating][0] + " " + r.rating : ""}</small></div><div class="r ${cls(r.move)}">${pc(r.move)}</div></div>`).join("") || `<div class="empty">Nothing yet</div>`}</div>`;
  $("#movers").innerHTML = list(top.slice(0, 8), "Top gainers since results") + list(top.slice(-8).reverse(), "Top losers since results");
  const secs = {};
  rows.forEach(r => (secs[r.sector || "Other"] = secs[r.sector || "Other"] || []).push(r));
  const order = Object.entries(secs).sort((a, b) => (a[0] === "Other") - (b[0] === "Other") || b[1].length - a[1].length);
  $("#secs").innerHTML = order.map(([name, rs]) => {
    const m = rs.filter(r => r.move != null), a = m.length ? m.reduce((x, r) => x + r.move, 0) / m.length : null;
    rs.sort((x, y) => (y.mcap || 0) - (x.mcap || 0));
    return `<div class="panel sec"><h2>${esc(name)} <small>${rs.length} · avg <b class="avg ${cls(a)}">${pc(a)}</b></small></h2><div class="tiles">` +
      rs.map(r => { const c = capOf(r.mcap); return `<div class="tile ${c === "Large" ? "L" : c === "Mid" ? "M" : ""}" style="background:${colour(r)}" data-s="${esc(r.sym)}" title="${esc(r.name)}"><b>${esc(r.sym)}</b><span>${pc(r.move)}</span></div>`; }).join("") + "</div></div>";
  }).join("");
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-s],[data-c],[data-k]"); if (!t) return;
  if (t.dataset.s) { const S = DATA.seasons[$("#season").value]; popup(S.rows.find(r => r.sym === t.dataset.s)); return; }
  const box = t.parentElement; box.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === t));
  if (t.dataset.c) st.cap = t.dataset.c; else st.colour = t.dataset.k;
  draw();
});
$("#q").addEventListener("input", e => { st.q = e.target.value.trim().toLowerCase(); draw(); });
loadData().then(() => { $("#season").addEventListener("change", draw); draw(); });
</script>
</main></body></html>
